<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page non trouvée</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #FF69B4 0%, #9370DB 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 120px;
      margin: 0;
      font-weight: 800;
    }
    p {
      font-size: 24px;
      margin: 20px 0;
    }
    a {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 40px;
      background: white;
      color: #FF69B4;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: transform 0.3s;
    }
    a:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Oops ! Page non trouvée</p>
    <p style="font-size: 16px; opacity: 0.9;">La page que vous cherchez n'existe pas.</p>
    <a href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
